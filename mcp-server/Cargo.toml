[package]
name = "rct-mcp"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "RustCuiTool MCP server (stdio + local WebSocket bridge)"
build = "build.rs"

[[bin]]
name = "RCT-MCP"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"
url = "2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
