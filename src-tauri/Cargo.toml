[package]
name = "rustcuitool"
version = "1.0.1"
description = "RustCuiTool — visual editor for Rust (Oxide / Carbon) CUI interfaces"
authors = ["hammzat", "Wakanda1519", "createprojectile"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "RCT"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
